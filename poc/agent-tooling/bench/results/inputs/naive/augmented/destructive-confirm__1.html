<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delete confirmation</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 3rem;
      background: #f4f5f7;
    }
  </style>
</head>
<body>
  <bl-dialog open critical caption="Delete project?">
    This will permanently delete the project and all of its data. This action cannot be undone.
    <bl-button slot="primary-action" kind="danger" autofocus>Delete</bl-button>
    <bl-button slot="secondary-action" kind="neutral">Cancel</bl-button>
  </bl-dialog>
</body>
</html>
