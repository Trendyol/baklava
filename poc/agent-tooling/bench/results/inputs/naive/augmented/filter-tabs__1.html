<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Filter Tabs</title>
  <script type="module" src="/dist/baklava.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #1f2430; }
    .stack { display: grid; gap: 1.5rem; }
    bl-tab-panel { padding: 1rem 0; }
  </style>
</head>
<body>
  <main class="stack">
    <h1>Product Views</h1>

    <!-- Real Baklava tabs: bl-tab in the "tabs" slot, bl-tab-panel in the default slot -->
    <bl-tab-group aria-label="Switch between product views">
      <bl-tab slot="tabs" name="overview" caption="Overview"></bl-tab>
      <bl-tab slot="tabs" name="details" caption="Details" selected></bl-tab>
      <bl-tab slot="tabs" name="related" caption="Related"></bl-tab>

      <bl-tab-panel tab="overview">
        <p>Overview panel content: key product information is summarized here.</p>
      </bl-tab-panel>
      <bl-tab-panel tab="details">
        <ul>
          <li>Technical specifications</li>
          <li>Compatibility notes</li>
          <li>Available variants</li>
        </ul>
      </bl-tab-panel>
      <bl-tab-panel tab="related">
        <p>Related products live in this panel.</p>
      </bl-tab-panel>
    </bl-tab-group>

    <!-- Small icon button with a real Baklava tooltip (trigger via slot) -->
    <bl-tooltip placement="top">
      Open settings
      <bl-button
        slot="tooltip-trigger"
        variant="tertiary"
        size="small"
        icon="settings"
        label="Settings"
      ></bl-button>
    </bl-tooltip>
  </main>
</body>
</html>
