<bl-accordion-group>
  <bl-accordion caption="How do I reset my password?" open>
    <p>Go to Settings &gt; Security and choose "Reset password". A reset link will be sent to your email.</p>
  </bl-accordion>
  <bl-accordion caption="How do I change my email address?">
    <p>Open Profile and update your email, then confirm the new address via the verification email.</p>
  </bl-accordion>
  <bl-accordion caption="How do I delete my account?">
    <p>This action is permanent. Contact support to request account deletion.</p>
  </bl-accordion>
</bl-accordion-group>
