<div class="settings">
  <div class="setting-row">
    <bl-switch>Enable notifications</bl-switch>
    <p class="hint">Get a notification when something happens.</p>
  </div>
  <div class="setting-row">
    <bl-switch checked>Dark mode</bl-switch>
    <p class="hint">Use a darker color scheme.</p>
  </div>
  <div class="setting-row">
    <bl-switch>Auto-save</bl-switch>
    <p class="hint">Save changes automatically.</p>
  </div>
  <div class="setting-row">
    <label>Language</label>
    <bl-select placeholder="Choose language">
      <bl-select-option value="en">English</bl-select-option>
      <bl-select-option value="de">Deutsch</bl-select-option>
      <bl-select-option value="tr">Türkçe</bl-select-option>
    </bl-select>
    <p class="hint">Language used across the interface.</p>
  </div>
</div>
