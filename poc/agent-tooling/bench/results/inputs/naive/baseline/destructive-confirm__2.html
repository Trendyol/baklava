<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delete Confirmation</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f4f5f7;
    }
    .page-card {
      width: 360px;
      padding: 24px;
      border-radius: 12px;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="page-card">
    <h2>Delete this item?</h2>
    <bl-dialog open kind="danger" caption="Delete confirmation">
      <p>This action cannot be undone. Are you sure you want to permanently delete this item?</p>
      <bl-button kind="danger" slot="footer">Delete</bl-button>
      <bl-button variant="secondary" slot="footer">Cancel</bl-button>
    </bl-dialog>
  </div>
</body>
</html>
