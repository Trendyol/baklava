<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Delete confirmation</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; }
    .page { padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45);
      display: flex; align-items: center; justify-content: center; z-index: 10;
    }
    .modal {
      background: #fff; border-radius: 8px; padding: 24px; width: 420px; max-width: 90vw;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.2);
    }
    .modal h2 { margin: 0 0 8px; font-size: 18px; }
    .modal p { margin: 0 0 20px; color: #555; line-height: 1.5; }
    .actions { display: flex; justify-content: flex-end; gap: 12px; }
    .btn { border: 1px solid transparent; border-radius: 6px; padding: 8px 16px; cursor: pointer; font-size: 14px; }
    .btn-danger { background: #d93025; color: #fff; }
    .btn-cancel { background: #f5f5f5; color: #333; border-color: #d9d9d9; }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="page">
    <p>Account settings preview.</p>
  </div>

  <div class="overlay" aria-hidden="false">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <h2 id="confirm-title">Delete this account?</h2>
      <p>This action cannot be undone. All data associated with this account will be permanently removed.</p>
      <div class="actions">
        <button class="btn btn-cancel" type="button">Cancel</button>
        <button class="btn btn-danger" type="button">Delete</button>
      </div>
    </div>
  </div>
</body>
</html>
