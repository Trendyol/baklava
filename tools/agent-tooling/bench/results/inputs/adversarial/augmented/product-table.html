<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalog</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #fafafa; color: #1d1d1d; }
    .page { max-width: 960px; margin: 0 auto; padding: 32px 24px; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .page-title { margin: 0; font-size: 22px; font-weight: 600; }
    .table-wrap { background: #fff; border: 1px solid #e6e6e6; border-radius: 8px; overflow: hidden; }
    .pagination-wrap { background: #fff; border: 1px solid #e6e6e6; border-top: 0; border-radius: 0 0 8px 8px; padding: 12px 16px; }
  </style>
</head>
<body>
  <main class="page">
    <div class="page-header">
      <h1 class="page-title">Product Catalog</h1>
      <bl-button variant="primary">Add Product</bl-button>
    </div>

    <div class="table-wrap">
      <bl-table>
        <bl-table-header sticky>
          <bl-table-row>
            <bl-table-header-cell>Product</bl-table-header-cell>
            <bl-table-header-cell>Category</bl-table-header-cell>
            <bl-table-header-cell>Price</bl-table-header-cell>
            <bl-table-header-cell>Status</bl-table-header-cell>
            <bl-table-header-cell>Actions</bl-table-header-cell>
          </bl-table-row>
        </bl-table-header>
        <bl-table-body>
          <bl-table-row>
            <bl-table-cell>Wireless Headphones</bl-table-cell>
            <bl-table-cell>Audio</bl-table-cell>
            <bl-table-cell>$89.00</bl-table-cell>
            <bl-table-cell><bl-badge size="small">Popular</bl-badge></bl-table-cell>
            <bl-table-cell>
              <bl-button variant="secondary" size="small">Edit</bl-button>
              <span style="display:inline-block;width:8px;"></span>
              <bl-button kind="danger" size="small">Delete</bl-button>
            </bl-table-cell>
          </bl-table-row>
          <bl-table-row>
            <bl-table-cell>Mechanical Keyboard</bl-table-cell>
            <bl-table-cell>Accessories</bl-table-cell>
            <bl-table-cell>$129.00</bl-table-cell>
            <bl-table-cell><bl-badge size="small">Popular</bl-badge></bl-table-cell>
            <bl-table-cell>
              <bl-button variant="secondary" size="small">Edit</bl-button>
              <span style="display:inline-block;width:8px;"></span>
              <bl-button kind="danger" size="small">Delete</bl-button>
            </bl-table-cell>
          </bl-table-row>
          <bl-table-row>
            <bl-table-cell>USB-C Hub</bl-table-cell>
            <bl-table-cell>Accessories</bl-table-cell>
            <bl-table-cell>$49.00</bl-table-cell>
            <bl-table-cell>—</bl-table-cell>
            <bl-table-cell>
              <bl-button variant="secondary" size="small">Edit</bl-button>
              <span style="display:inline-block;width:8px;"></span>
              <bl-button kind="danger" size="small">Delete</bl-button>
            </bl-table-cell>
          </bl-table-row>
          <bl-table-row>
            <bl-table-cell>4K Monitor 27"</bl-table-cell>
            <bl-table-cell>Displays</bl-table-cell>
            <bl-table-cell>$349.00</bl-table-cell>
            <bl-table-cell>—</bl-table-cell>
            <bl-table-cell>
              <bl-button variant="secondary" size="small">Edit</bl-button>
              <span style="display:inline-block;width:8px;"></span>
              <bl-button kind="danger" size="small">Delete</bl-button>
            </bl-table-cell>
          </bl-table-row>
        </bl-table-body>
      </bl-table>
    </div>

    <div class="pagination-wrap">
      <bl-pagination current-page="1" total-items="24" items-per-page="10"></bl-pagination>
    </div>
  </main>
</body>
</html>
