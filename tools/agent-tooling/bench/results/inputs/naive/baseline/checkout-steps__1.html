<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f6f7f9; color: #1c1c1e; }
    .checkout { max-width: 640px; margin: 48px auto; padding: 24px; background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .cart-line { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; color: #5b5b5e; }
    .badge { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="checkout">
    <div class="cart-line">
      <span aria-hidden="true">🛒</span>
      <span class="badge">2</span>
    </div>
    <h1>Checkout</h1>
    <bl-stepper current="cart">
      <bl-stepper-item label="Cart" current></bl-stepper-item>
      <bl-stepper-item label="Shipping"></bl-stepper-item>
      <bl-stepper-item label="Payment"></bl-stepper-item>
    </bl-stepper>
    <p>Review the items in your cart before continuing to shipping and payment.</p>
  </div>
</body>
</html>
