<section class="settings">
  <h2>Settings</h2>
  <p class="page-hint">Adjust your preferences below.</p>

  <div class="options">
    <label class="option-item">
      <bl-switch id="notifications"></bl-switch>
      <span class="option-text">
        <span class="option-title">Email notifications</span>
        <span class="option-hint">Get an email for every new message.</span>
      </span>
    </label>

    <label class="option-item">
      <bl-switch id="dark-mode"></bl-switch>
      <span class="option-text">
        <span class="option-title">Dark mode</span>
        <span class="option-hint">Use a dark color scheme across the app.</span>
      </span>
    </label>

    <label class="option-item">
      <bl-switch id="autosave"></bl-switch>
      <span class="option-text">
        <span class="option-title">Autosave</span>
        <span class="option-hint">Save your changes automatically as you type.</span>
      </span>
    </label>
  </div>

  <div class="language-row">
    <bl-select id="language" label="Language" help-text="Choose the language used for the interface." placeholder="Select a language">
      <bl-select-option value="en">English</bl-select-option>
      <bl-select-option value="tr">Türkçe</bl-select-option>
      <bl-select-option value="de">Deutsch</bl-select-option>
      <bl-select-option value="fr">Français</bl-select-option>
    </bl-select>
    <span class="option-hint language-hint">The selected language applies to the whole site.</span>
  </div>
</section>

<style>
  .settings {
    font-family: var(--bl-font-family, sans-serif);
    max-width: 560px;
    margin: 0 auto;
    padding: 24px;
    color: var(--bl-color-text, #1a2433);
  }
  .settings h2 { margin: 0 0 4px; }
  .page-hint { color: var(--bl-color-text-secondary, #5b6572); margin: 0 0 24px; }
  .options { display: flex; flex-direction: column; gap: 18px; margin-bottom: 28px; }
  .option-item { display: flex; align-items: center; gap: 14px; }
  .option-text { display: flex; flex-direction: column; gap: 2px; }
  .option-title { font-weight: 600; }
  .option-hint { font-size: 13px; color: var(--bl-color-text-secondary, #5b6572); }
  .language-row { display: flex; flex-direction: column; gap: 6px; max-width: 280px; }
  .language-hint { margin: 0; }
</style>

<script type="module">
  const switches = document.querySelectorAll('bl-switch');
  for (const el of switches) {
    el.addEventListener('bl-switch-toggle', (e) => {
      console.log(`${el.id} -> ${e.detail}`);
    });
  }

  const language = document.querySelector('#language');
  if (language) {
    language.addEventListener('bl-select', (e) => {
      console.log(`language changed -> ${e.detail}`);
    });
  }
</script>
