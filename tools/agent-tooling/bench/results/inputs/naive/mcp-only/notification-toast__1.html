<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save notification toast</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: #f5f6f8;
      display: grid;
      place-items: center;
    }
    .demo {
      background: #fff;
      border: 1px solid #e5e8ee;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    bl-notification {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 999;
    }
  </style>
</head>
<body>
  <div class="demo">
    <span>Settings were edited</span>
    <bl-button variant="primary" id="save-btn">Save changes</bl-button>
  </div>

  <bl-notification id="notifications" no-animation></bl-notification>

  <script type="module">
    const saveBtn = document.getElementById('save-btn');
    const notifications = document.getElementById('notifications');

    saveBtn.addEventListener('bl-click', () => {
      notifications.addNotification({
        caption: 'Your changes have been saved successfully.',
        variant: 'success',
        permanent: false,
        duration: 7,
        icon: 'check',
      });
    });
  </script>
</body>
</html>
