<bl-tab-group>

  <bl-tab slot="tabs" name="analytics">Analytics</bl-tab>
  <bl-tab slot="tabs" name="settings">Settings</bl-tab>

  <bl-tab-panel tab="overview">
    <h2>Overview</h2>
    <p>Summary of your account activity and key metrics.</p>
  </bl-tab-panel>

  <bl-tab-panel tab="analytics">
    <h2>Analytics</h2>
    <p>Detailed analytics and reports for this page.</p>
  </bl-tab-panel>

  <bl-tab-panel tab="settings">
    <h2>Settings</h2>
    <p>Configure your preferences here.</p>

      <bl-button slot="tooltip-trigger" size="small" icon="info">Help</bl-button>
      <span>Shows help about the settings options on this tab.</span>
    </bl-tooltip>
  </bl-tab-panel>
</bl-tab-group>
