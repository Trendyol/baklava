<bl-dialog open critical caption="Delete item?">
  <p slot="">
    This action is irreversible. The item will be permanently removed and cannot be recovered.
  </p>
  <bl-button slot="secondary-action" variant="secondary" @bl-click="close()">Cancel</bl-button>
  <bl-button slot="primary-action" kind="danger" @bl-click="confirmDelete()">Delete</bl-button>
</bl-dialog>
