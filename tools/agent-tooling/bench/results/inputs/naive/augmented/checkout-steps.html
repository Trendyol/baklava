<h3>Checkout</h3>
<bl-stepper id="checkout-stepper" direction="horizontal" type="dot" usage="non-clickable">
  <bl-stepper-item id="step-cart" variant="success" title="Cart" description="Items added"></bl-stepper-item>
  <bl-stepper-item id="step-shipping" variant="active" title="Shipping" description="Current step"></bl-stepper-item>
  <bl-stepper-item id="step-payment" title="Payment" description="Up next"></bl-stepper-item>
</bl-stepper>
<h3>Your cart</h3>
<bl-badge size="large">2 items</bl-badge>
