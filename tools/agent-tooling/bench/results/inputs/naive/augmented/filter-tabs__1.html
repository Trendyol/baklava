<bl-tab-group>
  <bl-tab name="all" slot="tabs">All</bl-tab>
  <bl-tab name="active" slot="tabs">Active</bl-tab>
  <bl-tab name="archived" slot="tabs">Archived</bl-tab>

  <bl-tab-panel tab="all">
    <h3>All items</h3>
    <p>Everything in this workspace, newest first.</p>
  </bl-tab-panel>

  <bl-tab-panel tab="active">
    <h3>Active items</h3>
    <p>Items that are currently in progress.</p>
  </bl-tab-panel>

  <bl-tab-panel tab="archived">
    <h3>Archived items</h3>
    <p>Closed and archived items.</p>
  </bl-tab-panel>
</bl-tab-group>

<bl-tooltip placement="top">
  <bl-button slot="tooltip-trigger" icon="info" variant="tertiary" size="small" aria-label="Filter help">Help</bl-button>
  Filters show only matching items. Click a tab to switch the view.
</bl-tooltip>
