<form class="login-form" novalidate>
  <bl-input
    name="email"
    type="email"
    label="Email address"
    placeholder="you@example.com"
    autocomplete="email"
    required
  ></bl-input>
  <bl-input
    name="password"
    type="password"
    label="Password"
    placeholder="Enter your password"
    autocomplete="current-password"
    required
  ></bl-input>
  <bl-button variant="primary" type="submit">Sign in</bl-button>
</form>
<script>
  const form = document.querySelector('form.login-form');
  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const data = new FormData(form);
    console.log('signing in as', data.get('email'));
  });
</script>
