<form id="login-form" class="login-form">
  <bl-input
    name="email"
    type="email"
    label="Email address"
    placeholder="you@example.com"
    autocomplete="email"
    required
  ></bl-input>
  <bl-input
    name="password"
    type="password"
    label="Password"
    placeholder="Enter your password"
    autocomplete="current-password"
    required
  ></bl-input>
  <bl-button
    type="submit"
    variant="primary"
    size="large"
    label="Sign in"
  ></bl-button>
</form>
<script>
  const form = document.querySelector('#login-form');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const data = new FormData(form);
    console.log('login submitted:', data.get('email'), data.get('password'));
  });
</script>
