<section aria-label="Settings">
  <h2>Settings</h2>

  <bl-select label="Language" value="en" help-text="Choose your preferred language.">
    <bl-select-option value="en" label="English"></bl-select-option>
    <bl-select-option value="tr" label="Türkçe"></bl-select-option>
    <bl-select-option value="de" label="Deutsch"></bl-select-option>
  </bl-select>

  <ul>
    <li>
      <bl-switch>Email notifications</bl-switch>
      <p class="hint">Receive email updates about your account.</p>
    </li>
    <li>
      <bl-switch>Dark mode</bl-switch>
      <p class="hint">Use a dark color scheme throughout the app.</p>
    </li>
    <li>
      <bl-switch>Auto-play videos</bl-switch>
      <p class="hint">Play videos automatically when you open them.</p>
    </li>
  </ul>
</section>
