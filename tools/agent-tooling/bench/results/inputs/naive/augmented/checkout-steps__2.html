<style>
  .checkout { max-width: 640px; margin-block: 8px; }
  .cart { position: relative; display: inline-flex; align-items: center; margin-bottom: 16px; }
  .cart bl-icon { font-size: 24px; }
  .cart bl-badge { position: absolute; top: -8px; right: -10px; }
</style>

<section class="checkout">
  <span class="cart">
    <bl-icon name="cart"></bl-icon>
    <bl-badge size="small">2</bl-badge>
  </span>

  <bl-stepper type="icon" direction="horizontal" usage="clickable">
    <bl-stepper-item variant="active" title="Cart" description="2 items" icon="cart"></bl-stepper-item>
    <bl-stepper-item title="Shipping" description="Delivery address" icon="truck"></bl-stepper-item>
    <bl-stepper-item title="Payment" description="Card details" icon="credit-card"></bl-stepper-item>
  </bl-stepper>
</section>
