<bl-table>
  <bl-table-header sticky>
    <bl-table-row>
      <bl-table-header-cell>Product</bl-table-header-cell>
      <bl-table-header-cell>Price</bl-table-header-cell>
      <bl-table-header-cell>Stock</bl-table-header-cell>
      <bl-table-header-cell>Status</bl-table-header-cell>
      <bl-table-header-cell>Action</bl-table-header-cell>
    </bl-table-row>
  </bl-table-header>
  <bl-table-body>
    <bl-table-row>
      <bl-table-cell>Wireless Headphones <bl-badge size="small">Popular</bl-badge></bl-table-cell>
      <bl-table-cell>$129.99</bl-table-cell>
      <bl-table-cell>42</bl-table-cell>
      <bl-table-cell>In Stock</bl-table-cell>
      <bl-table-cell><bl-button variant="primary" size="small" label="View"></bl-button></bl-table-cell>
    </bl-table-row>
    <bl-table-row>
      <bl-table-cell>Mechanical Keyboard <bl-badge size="small">Popular</bl-badge></bl-table-cell>
      <bl-table-cell>$89.00</bl-table-cell>
      <bl-table-cell>18</bl-table-cell>
      <bl-table-cell>In Stock</bl-table-cell>
      <bl-table-cell><bl-button variant="secondary" size="small" label="View"></bl-button></bl-table-cell>
    </bl-table-row>
    <bl-table-row>
      <bl-table-cell>USB-C Hub</bl-table-cell>
      <bl-table-cell>$49.50</bl-table-cell>
      <bl-table-cell>0</bl-table-cell>
      <bl-table-cell>Out of Stock</bl-table-cell>
      <bl-table-cell><bl-button variant="secondary" size="small" label="View"></bl-button></bl-table-cell>
    </bl-table-row>
    <bl-table-row>
      <bl-table-cell>4K Monitor</bl-table-cell>
      <bl-table-cell>$299.00</bl-table-cell>
      <bl-table-cell>7</bl-table-cell>
      <bl-table-cell>In Stock</bl-table-cell>
      <bl-table-cell><bl-button variant="secondary" size="small" label="View"></bl-button></bl-table-cell>
    </bl-table-row>
  </bl-table-body>
</bl-table>
<bl-pagination
  current-page="1"
  total-items="40"
  items-per-page="10"
  has-jumper="true"
  jumper-label="Go to page"></bl-pagination>
<script type="module">
  document.querySelector('bl-pagination').addEventListener('bl-change', (event) => {
    document.querySelector('bl-table-body').innerHTML = '';
    console.log('page changed', event.detail);
  });
</script>
