<bl-dialog id="confirmDialog" open caption="Confirm deletion" critical>
  <p>This item will be permanently removed. This action cannot be undone.</p>
  <bl-button slot="primary-action" kind="danger" label="Delete item"></bl-button>
  <bl-button slot="secondary-action" variant="tertiary" label="Cancel"></bl-button>
</bl-dialog>

<bl-button id="deleteTrigger" kind="danger" label="Delete item"></bl-button>

<script>
  const dialog = document.querySelector('#confirmDialog');
  document.querySelector('#deleteTrigger').addEventListener('bl-click', () => {
    dialog.setAttribute('open', '');
  });
  document.querySelector('[slot="secondary-action"]').addEventListener('bl-click', () => {
    dialog.removeAttribute('open');
  });
  document.querySelector('[slot="primary-action"]').addEventListener('bl-click', () => {
    dialog.removeAttribute('open');
  });
</script>
