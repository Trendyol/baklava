<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Settings</title>
  </head>
  <body>
    <ul class="settings-list">
      <li>
        <bl-switch checked>Email notifications</bl-switch>
        <p class="hint">Send updates about your account activity.</p>
      </li>
      <li>
        <bl-switch>Weekly digest</bl-switch>
        <p class="hint">A summary of new features every Monday.</p>
      </li>
      <li>
        <bl-switch>Two-factor authentication</bl-switch>
        <p class="hint">Add an extra security layer when signing in.</p>
      </li>
      <li>
        <bl-select label="Language" help-text="Choose your preferred language." placeholder="Select a language">
          <bl-select-option value="en" label="English">English</bl-select-option>
          <bl-select-option value="tr" label="Türkçe">Türkçe</bl-select-option>
          <bl-select-option value="de" label="Deutsch">Deutsch</bl-select-option>
        </bl-select>
      </li>
    </ul>

    <script>
      const switches = document.querySelectorAll('bl-switch');
      switches.forEach((s) => {
        s.addEventListener('bl-switch-toggle', (e) => {
          const name = s.textContent.trim();
          s.setAttribute('data-state', e.detail.toString());
        });
      });
      const select = document.querySelector('bl-select');
      select.addEventListener('bl-blur', (e) => {
        select.setAttribute('data-language', String(e.detail ?? ''));
      });
    </script>
  </body>
</html>
