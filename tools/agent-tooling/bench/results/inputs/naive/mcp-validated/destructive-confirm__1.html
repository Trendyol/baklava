<bl-button>
  Delete Product
</bl-button>
<bl-dialog open critical caption="Delete Product">
  <p>
    Are you sure you want to permanently delete this product? This action cannot be undone.
  </p>
  <bl-button slot="primary-action" kind="danger" variant="primary">
    Delete
  </bl-button>
  <bl-button slot="secondary-action" variant="secondary">
    Cancel
  </bl-button>
</bl-dialog>
