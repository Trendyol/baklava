<form class="login-form">
  <bl-input
    type="email"
    name="email"
    label="Email address"
    placeholder="you@example.com"
    required
    autocomplete="email"
  >
  </bl-input>
  <bl-input
    type="password"
    name="password"
    label="Password"
    placeholder="Enter your password"
    required
    autocomplete="current-password"
  >
  </bl-input>
  <bl-button type="submit" variant="primary" size="large" label="Sign in">
  </bl-button>
</form>
